name: Deploy

# We only use main: every push to main is checked, then deployed to production.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # The Firestore emulator used by the rules tests needs Java.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      # Game logic tests: fast and need no emulator, so they run first.
      - name: Unit tests
        run: npm run test:unit

      - name: Type-check and build
        run: npm run build

      - name: Firestore rules tests
        run: npm run test:rules

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Auth settings (anonymous sign-in) are left out: deploying them needs broader Firebase
      # permissions than this account has. Apply auth changes with `npm run deploy` as a project owner.
      - name: Deploy Hosting and Firestore rules
        run: npx firebase deploy --only hosting,firestore:rules --project default --non-interactive

      # Separate, and allowed to fail: creating an index may need more permissions than this
      # account has. The game falls back to AI opponents until the index exists. If this step
      # fails, run `npm run deploy` as a project owner.
      - name: Deploy Firestore indexes
        continue-on-error: true
        run: npx firebase deploy --only firestore:indexes --project default --non-interactive
