<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="An auto-battler for your phone. Draft creatures, build a team and outlast every rival." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="a game" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="a game" />
    <meta property="og:description" content="Draft creatures, build a team, outlast every rival." />
    <meta property="og:image" content="/pwa-512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>a game</title>
    <!-- Just enough to paint the first frame before the app's CSS and JS arrive. -->
    <style>
      /* The same two colours as :root in src/index.css, so the first frame is right. */
      html { color-scheme: light dark; background: #f2f2f7; color: #000; }
      html, body { margin: 0; height: 100%; }
      .boot { height: 100%; display: grid; place-content: center; gap: 24px; justify-items: center;
        font: 700 2.125rem/1.1 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
        letter-spacing: -.02em; }
      .boot i { width: 24px; height: 24px; border: 3px solid rgb(120 120 128 / .2);
        border-top-color: rgb(60 60 67 / .6); border-radius: 50%; animation: boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        html { background: #000; color: #fff; }
        .boot i { border-color: rgb(120 120 128 / .36); border-top-color: rgb(235 235 245 / .6); }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" aria-label="Loading a game">
      <div>a game</div><i></i>
    </div></div>
    <noscript>a game needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
