<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05060f" />
    <meta name="description" content="An auto-battler for your phone. Draft creatures, build a team and outlast every rival." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="a game" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="a game" />
    <meta property="og:description" content="Draft creatures, build a team, outlast every rival." />
    <meta property="og:image" content="/pwa-512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>a game</title>
    <!-- Just enough to paint the first frame before the app's CSS and JS arrive. -->
    <style>
      html, body { margin: 0; height: 100%; color: #f3f6ff; }
      html { background: radial-gradient(120% 70% at 50% 0%, #1b1548 0%, #0b0c26 45%, #05060f 100%) #05060f fixed; }
      .boot { height: 100%; display: grid; place-content: center; gap: 24px; justify-items: center;
        font: 600 2.25rem/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
        text-shadow: 0 0 6px rgb(54 226 255 / .9), 0 0 18px rgb(54 226 255 / .6), 0 0 42px rgb(255 61 240 / .45); }
      .boot i { width: 28px; height: 28px; border: 3px solid rgb(54 226 255 / .2); border-top-color: #36e2ff;
        border-radius: 50%; animation: boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" aria-label="Loading a game">
      <div>a game</div><i></i>
    </div></div>
    <noscript>a game needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
