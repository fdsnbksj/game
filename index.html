<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#fff4d6" />
    <meta name="description" content="Small logic puzzles for between chapters. One thumb, no sound, stop anytime." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="a game" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="a game" />
    <meta property="og:description" content="Small logic puzzles for between chapters." />
    <meta property="og:image" content="/pwa-512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>a game</title>
    <!-- Just enough to paint the first frame before the app's CSS and JS arrive. -->
    <style>
      /* The same colours as :root in src/index.css, so the first frame is right. */
      html { color-scheme: light; background: #fff4d6; color: #1b1b1f; }
      html, body { margin: 0; height: 100%; }
      .boot { height: 100%; display: grid; place-content: center; gap: 24px; justify-items: center;
        font: 650 1.75rem/1.1 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: -.03em; }
      .boot i { width: 24px; height: 24px; border: 3px solid #eadfc6;
        border-top-color: #f08c00; border-radius: 50%; animation: boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" aria-label="Loading a game">
      <div>a game</div><i></i>
    </div></div>
    <noscript>a game needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
